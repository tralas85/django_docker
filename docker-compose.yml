services:
  db:
    image: postgres:18
    container_name: postgres_db
    restart: always
    environment:
      DATABASE_HOST: 127.0.0.1
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: mi_contrasena
      POSTGRES_DB: mis_datos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "81:81"
    depends_on:
      - db

  web:
    build: .
    container_name: django
    command: gunicorn django_docker.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file:
      - .env
    volumes:
      - .:/code
    expose:
      - "8000"
    restart: always
    environment:
      - POSTGRES_USER=usuario
      - POSTGRES_PASSWORD=mi_contrasena
      - POSTGRES_NAME=mis_datos
    depends_on:
      - db

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:


